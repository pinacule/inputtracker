<!doctype html>
<html lang="en" data-theme="espresso">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <meta
      name="description"
      content="Personal media consumption library and tracker."
    />
    <meta name="theme-color" content="#14120f" />
    <title>InputTracker</title>
    <script>
      (function () {
        try {
          var valid = {
            espresso: "#14120f",
            midnight: "#0b1017",
            forest: "#0c130f",
            obsidian: "#0e0e11",
            plum: "#130e16",
          };
          var raw = localStorage.getItem("inputtracker.theme");
          var theme = raw && valid[raw] ? raw : "espresso";
          document.documentElement.setAttribute("data-theme", theme);
          var meta = document.querySelector('meta[name="theme-color"]');
          if (meta) meta.setAttribute("content", valid[theme]);
        } catch (e) {}
      })();
    </script>
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
