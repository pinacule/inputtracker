# Copy to inputtracker.config.toml (gitignored) and fill in. Never commit the real file.

timezone = "Europe/Bratislava"

[server]
bind = "127.0.0.1"
port = 8787

[storage]
# Defaults: ~/.local/share/inputtracker/inputtracker.db and ~/.local/share/inputtracker/backups/
# db_path = "/home/you/.local/share/inputtracker/inputtracker.db"
# backup_dir = "/home/you/.local/share/inputtracker/backups"
backup_keep = 14

[audiobookshelf]
url = "http://localhost:13378"   # on a VM: the PC's Tailscale address
token = "YOUR_ABS_API_KEY"
timeout_s = 20

[notify]
# Desktop notifications via notify-send. On by default; silently ignored when
# the binary is missing (e.g. a headless server).
desktop = true
# Optional ntfy topic URL (e.g. "https://ntfy.sh/my-topic"); leave empty to off.
ntfy_url = ""
# Optional ntfy access token ("Bearer ..." auth for protected ntfy servers).
# ntfy_token = "YOUR_NTFY_TOKEN"
# Optional web app URL (e.g. its Tailscale address); pushes become tappable via
# the ntfy "Click" header. Not sent when empty.
# app_url = "http://100.x.y.z:8787"
# Weekly summary push (once a week, "it notify weekly"): off by default. When
# enabled, the titles of what you consumed are sent to the ntfy server.
# weekly_summary = false
# Note: ntfy.sh topics are public by name. Pick a long random topic name (or
# host your own ntfy server / use a token), because anyone who knows the topic
# string can see the pushes.

# [simkl]
# Register a V2 app, type 'TV, devices & command line' at https://simkl.com/settings/developer/, paste its client_id
# client_id = "YOUR_SIMKL_CLIENT_ID"
# base_url = "https://api.simkl.com"
# poster_base_url = "https://simkl.in/posters"
# timeout_s = 20

# [youtube]
# Base URL used to fetch video thumbnails (YouTube Takeout imports carry a video id).
# thumb_base_url = "https://i.ytimg.com/vi"
# Minimum watched minutes on one local day for a YouTube video to count (0 disables).
# min_watch_minutes = 5
# Max videos enriched (channel + category via oEmbed/watch page) per sync run (0 disables).
# enrich_per_sync = 50

# [ingest]
# Token for POST /api/ingest/youtube-plays (the phone apps POST what YouTube
# plays here). Empty disables ingest. Generate one with `bun run it ingest
# token`; shorter than 32 characters is a config error. A secret: never commit
# or log it.
# token = ""

# [activitywatch]
# mode = "pull" # VM and pushing PC: "push" (disables local pull)
# ActivityWatch runs locally on the PC with aw-watcher-web in Chrome/Firefox.
# url = "http://127.0.0.1:5600"
# timeout_s = 20
# device = "pc"
# include_music = false

# [push]
# PC only; server uses the matching [ingest] token. Never expose ActivityWatch.
# server_url = "https://<vm-name>.<your-tailnet>.ts.net"
# token = ""

# [covers]
# Fallback cover lookup when an audiobook is no longer present on Audiobookshelf.
# When external is true, book titles and authors are sent to Open Library to find covers.
# external = true
# openlibrary_url = "https://openlibrary.org"
# openlibrary_covers_url = "https://covers.openlibrary.org"

# [metadata]
# External metadata lookup for adding past anime, series, films, books and audiobooks.
# Providers are keyless except optional TMDB (used ahead of iTunes/TVmaze when set).
# enabled = true
# anilist_url = "https://graphql.anilist.co"
# tvmaze_url = "https://api.tvmaze.com"
# cinemeta_url = "https://v3-cinemeta.strem.io"
# itunes_url = "https://itunes.apple.com"
# openlibrary_url = "https://openlibrary.org"
# openlibrary_covers_url = "https://covers.openlibrary.org"
# tmdb_url = "https://api.themoviedb.org/3"
# tmdb_image_url = "https://image.tmdb.org/t/p"
# tmdb_api_key = "YOUR_TMDB_API_KEY"

