# Copy to inputtracker.config.toml (gitignored) and fill in. Never commit the real file.

timezone = "Europe/Bratislava"

[server]
bind = "127.0.0.1"
port = 8787

[storage]
# Defaults: ~/.local/share/inputtracker/inputtracker.db and ~/.local/share/inputtracker/backups/
# db_path = "/home/you/.local/share/inputtracker/inputtracker.db"
# backup_dir = "/home/you/.local/share/inputtracker/backups"
backup_keep = 14

[audiobookshelf]
url = "http://localhost:13378"   # on a VM: the PC's Tailscale address
token = "YOUR_ABS_API_KEY"
timeout_s = 20

[notify]
# Desktop notifications via notify-send. On by default; silently ignored when
# the binary is missing (e.g. a headless server).
desktop = true
# Optional ntfy topic URL (e.g. "https://ntfy.sh/my-topic"); leave empty to off.
ntfy_url = ""

# [simkl]
# Register a V2 app, type 'TV, devices & command line' at https://simkl.com/settings/developer/, paste its client_id
# client_id = "YOUR_SIMKL_CLIENT_ID"
# base_url = "https://api.simkl.com"
# poster_base_url = "https://simkl.in/posters"
# timeout_s = 20

