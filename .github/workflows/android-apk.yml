name: Android APK

# Builds the dedicated InputTracker Android app (android/) as a DEBUG APK
# and uploads it as a workflow artifact — install it from the run page.
#
# Why debug: this pipeline needs no signing secrets at all. Gradle signs
# the debug variant automatically with the runner's debug key.
#
# Tradeoff (accepted 2026-10-22): every GitHub Actions runner generates a
# FRESH debug key, so each CI debug APK carries a different signature.
# Android will refuse to install a new CI debug build over a previous one —
# uninstall the old copy first (its settings, e.g. a changed server URL,
# are lost). The debug package id is dev.pinacule.inputtracker.debug, so
# it coexists with a release install.
#
# The release path is unchanged and still available: app/build.gradle.kts
# signs release builds from the KEYSTORE_* environment variables, fed by
# the four ANDROID_* repository secrets and the dedicated release keystore
# (see android/README.md). To return CI to release builds, restore the
# keystore-decode step and switch assembleDebug back to assembleRelease.

on:
  workflow_dispatch:
  push:
    branches: [muse/android-apk]
    paths:
      - "android/**"
      - ".github/workflows/android-apk.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      # No setup-android action: v3 bootstraps sdkmanager with the legacy
      # "tools" package, which no longer exists in the SDK repository, so
      # every run died there ("Failed to find package 'tools'"). The runner
      # image already ships an Android SDK; just add the packages we need.
      - name: Install Android SDK packages
        run: |
          SDKMANAGER=$(ls "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | sort -V | tail -n 1)
          echo "Using $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      # Via `sh`, not ./gradlew: the file was pushed through a route that
      # does not preserve the executable bit, so direct execution fails
      # with "Permission denied" (exit 126, run #7).
      - name: Build debug APK
        working-directory: android
        run: sh ./gradlew assembleDebug --no-daemon

      - name: Verify signature and checksum
        run: |
          APK=$(ls android/app/build/outputs/apk/debug/*.apk | head -n 1)
          echo "APK: $APK"
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -n 1)
          "$APKSIGNER" verify --print-certs "$APK" | head -n 6
          {
            echo "### InputTracker APK (debug)"
            echo ""
            echo "- File: \`$APK\`"
            echo "- SHA-256: \`$(sha256sum "$APK" | awk '{print $1}')\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: inputtracker-apk-debug-${{ github.sha }}
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
